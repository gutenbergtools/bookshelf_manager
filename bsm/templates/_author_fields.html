<div class="fields"> <div class="wide"> <label for="author">Name</label> <input id="author" name="author" type="text" required maxlength="240" value="{{ author.author|default:'' }}" title="Enter the name or pseudonym the author is best known under. Put lesser known names or pseudonyms in aliases. Use full unicode here and put an ASCII-fied version in aliases.(eg. Brontë, Charlotte)"> </div> <div> <label for="born_floor">Born (earliest)</label> <input id="born_floor" name="born_floor" type="number" min="-4000" max="2100" value="{{ author.born_floor|default_if_none:'' }}" title="Year the author was born (earliest estimate). Leave empty if unknown. (eg. 1803, -250)"> </div> <div> <label for="born_ceil">Born (latest)</label> <input id="born_ceil" name="born_ceil" type="number" min="-4000" max="2100" value="{{ author.born_ceil|default_if_none:'' }}" title="Year the author was born (latest estimate). Leave empty if unknown. (eg. 1803, -250)"> </div> <div> <label for="died_floor">Died (earliest)</label> <input id="died_floor" name="died_floor" type="number" min="-4000" max="2100" value="{{ author.died_floor|default_if_none:'' }}" title="Year the author died (earliest estimate). Leave empty if unknown. (eg. 1803, -250)"> </div> <div> <label for="died_ceil">Died (latest)</label> <input id="died_ceil" name="died_ceil" type="number" min="-4000" max="2100" value="{{ author.died_ceil|default_if_none:'' }}" title="Year the author died (latest estimate). Leave empty if unknown. (eg. 1803, -250)"> </div> <div class="wide"> <label for="note">Note</label> <textarea id="note" name="note" maxlength="10000" title="Any note relevant to the cataloging people.">{{ author.note|default:'' }}</textarea> </div> </div>
