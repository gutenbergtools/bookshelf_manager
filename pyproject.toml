[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
  "E731",  # lambda assigned (compact wrappers)
  "E741",  # short names like Column aliases
]

[tool.ruff.lint.per-file-ignores]
"catalog/settings/__init__.py" = ["F403"]
