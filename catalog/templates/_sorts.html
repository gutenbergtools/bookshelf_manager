{% if sorts %}<form method="get" class="sortbar"> {% for key, value in request.GET.items %}{% if key != "sort" and key != "page" %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}{% endfor %} <label for="sort">Sort by</label> <select id="sort" name="sort" data-autosubmit> {% for key, label in sorts %}<option value="{{ key }}"{% if key == sort or not sort and forloop.first %} selected{% endif %}>{{ label }}</option>{% endfor %} </select> </form>{% endif %}
